<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curriculum Vitae - Indika Amarasinghe</title>
<meta name="description" content="Full web CV of Indika Amarasinghe - project execution, sustainable finance, AI integration and web tool development. Viewable online and downloadable as PDF.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --brand1: #667eea;
    --brand2: #764ba2;
    --ink: #1f2937;
    --muted: #6b7280;
    --line: #e5e7eb;
    --bg: #f3f4f6;
    --print-navy: #1f3864;
    --link: #1558d6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--link); }
  /* Links are blue and never underlined - the colour carries the signal. */
  a.inline-link { color: var(--link); text-decoration: none; }
  a.inline-link:hover { text-decoration: none; opacity: .8; }

  /* ── Toolbar ── */
  .toolbar {
    position: sticky; top: 0; z-index: 60;
    background: rgba(255,255,255,0.94);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    padding: 10px 16px;
    display: flex; gap: 10px; align-items: center; justify-content: center;
    flex-wrap: wrap;
  }
  .tb-btn {
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid var(--line); background: white; color: var(--ink);
    border-radius: 10px; padding: 9px 15px; font-size: .86rem; font-weight: 600;
    font-family: inherit; cursor: pointer; text-decoration: none;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .tb-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,0,0,.08); }
  .tb-btn svg { width: 16px; height: 16px; fill: currentColor; }
  .tb-btn.primary {
    background: linear-gradient(135deg, var(--brand1), var(--brand2));
    color: white; border-color: transparent;
  }

  /* ── Mobile section strip (always visible) ── */
  .mobile-nav {
    display: none;
    position: sticky; top: 55px; z-index: 55;
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    padding: 8px 12px;
    overflow-x: auto; white-space: nowrap;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .mobile-nav::-webkit-scrollbar { display: none; }
  .mobile-nav a {
    display: inline-block; padding: 6px 12px; margin-right: 6px;
    border-radius: 999px; background: #f3f4f6; color: #4b5563;
    font-size: .78rem; font-weight: 600; text-decoration: none;
  }
  .mobile-nav a.active { background: #eef0fb; color: var(--brand2); }

  /* ── Page shell ── */
  .page { max-width: 980px; margin: 24px auto 60px; padding: 0 16px; }
  /* No overflow:hidden here: it would become the scroll container and
     stop the section list from sticking. The corners are rounded on the
     header and footer instead. */
  .sheet {
    background: white; border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,.08);
  }

  /* ── Header ── */
  .cv-header {
    background: linear-gradient(135deg, var(--brand1) 0%, var(--brand2) 100%);
    color: white; padding: 44px 36px 38px; position: relative; overflow: hidden;
    border-radius: 18px 18px 0 0;
  }
  .cv-name { font-size: 2.1rem; font-weight: 700; letter-spacing: -0.5px; }
  .cv-headline { font-size: 1.02rem; font-weight: 300; opacity: .93; margin-top: 6px; }
  .cv-contacts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.22);
    border-radius: 999px; padding: 6px 13px; font-size: .82rem;
    color: white; text-decoration: none; cursor: pointer;
  }
  .chip:hover { background: rgba(255,255,255,.28); }
  .chip-ic { margin-right: 2px; }
  .cv-rights {
    margin-top: 16px; font-size: .82rem; opacity: .9;
    border-left: 3px solid rgba(255,255,255,.5); padding-left: 10px;
  }

  /* ── Layout ── */
  .cv-body { display: grid; grid-template-columns: 218px 1fr; }
  .cv-nav {
    border-right: 1px solid var(--line); background: #fafafb; padding: 22px 12px;
    border-bottom-left-radius: 18px;
  }
  .cv-nav-inner {
    position: sticky; top: 72px;
    max-height: calc(100vh - 96px); overflow-y: auto; scrollbar-width: thin;
  }
  .cv-nav-title {
    font-size: .68rem; letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted); font-weight: 700; margin-bottom: 10px; padding-left: 10px;
  }
  .cv-nav a {
    display: block; padding: 8px 10px; border-radius: 8px;
    font-size: .84rem; color: #4b5563; text-decoration: none; font-weight: 500;
  }
  .cv-nav a:hover { background: #eef0fb; color: var(--brand2); }
  .cv-nav a.active { background: #eef0fb; color: var(--brand2); font-weight: 600; }

  .cv-main { padding: 26px 34px 40px; min-width: 0; }

  section.cv-section { padding: 20px 0; border-bottom: 1px solid var(--line); scroll-margin-top: 110px; }
  section.cv-section:last-child { border-bottom: none; }
  .sec-title {
    display: flex; align-items: center; gap: 9px;
    font-size: 1.16rem; font-weight: 700; color: #111827; margin-bottom: 16px;
  }
  .sec-title .ic { font-size: 1.05rem; }

  /* text */
  .para { margin-bottom: 12px; color: #374151; font-size: .94rem; }
  .para:last-child { margin-bottom: 0; }

  /* pairs */
  .pairs { display: grid; grid-template-columns: repeat(auto-fit, minmax(255px, 1fr)); gap: 10px 22px; }
  .pair { font-size: .9rem; }
  .pair .lbl {
    display: block; font-size: .7rem; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); font-weight: 700;
  }
  .pair .val { color: #374151; }

  /* groups */
  .group { margin-bottom: 18px; }
  .group:last-child { margin-bottom: 0; }
  .group-name { font-size: .95rem; font-weight: 600; color: var(--brand2); margin-bottom: 8px; }
  .tags { display: flex; flex-wrap: wrap; gap: 7px; }
  .tag {
    background: #f3f4ff; color: #4338ca; border: 1px solid #e0e2fb;
    border-radius: 8px; padding: 5px 11px; font-size: .82rem;
    text-decoration: none; display: inline-block;
  }
  a.tag:hover { background: #e4e7ff; border-color: #c7cbf7; }
  a.tag::after { content: ' \2197'; font-size: .72em; opacity: .7; }

  /* chart */
  .chart-wrap {
    display: flex; gap: 26px; align-items: center; flex-wrap: wrap;
    background: none; border: none; padding: 6px 0 0; margin: 0;
    font: inherit; color: inherit; text-align: left; cursor: pointer; width: 100%;
  }
  .chart-wrap:focus-visible { outline: 3px solid #c7d2fe; outline-offset: 6px; border-radius: 14px; }
  .donut { width: 190px; height: 190px; flex-shrink: 0; }
  .donut .slice {
    fill: none; stroke-width: 26;
    transition: stroke-width .25s cubic-bezier(.22,1,.36,1), opacity .25s ease;
  }
  .chart-wrap:hover .donut .slice { opacity: .55; }
  .chart-wrap:hover .donut .slice:hover,
  .chart-wrap .donut .slice.is-on { opacity: 1; stroke-width: 32; }
  .donut-centre-label { font-size: 9.5px; fill: var(--muted); font-weight: 600; letter-spacing: .06em; }
  .donut-centre-value { font-size: 22px; font-weight: 700; fill: #111827; }
  .chart-legend { flex: 1; min-width: 230px; display: flex; flex-direction: column; gap: 8px; }
  .legend-row {
    display: flex; align-items: center; gap: 10px; font-size: .88rem; color: #374151;
  }
  .legend-swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
  .legend-pct { margin-left: auto; font-weight: 700; color: #111827; font-variant-numeric: tabular-nums; }
  .chart-caption { font-size: .8rem; color: var(--muted); margin-top: 14px; }
  .chart-caption a { color: var(--brand2); }

  /* entries */
  .entry { position: relative; padding: 0 0 20px 20px; border-left: 2px solid #eceefb; }
  .entry:last-child { padding-bottom: 0; }
  .entry::before {
    content: ''; position: absolute; left: -6px; top: 6px;
    width: 10px; height: 10px; border-radius: 50%;
    background: linear-gradient(135deg, var(--brand1), var(--brand2));
  }
  .entry-head {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 14px; flex-wrap: wrap;
  }
  .entry-title { font-size: .99rem; font-weight: 700; color: #111827; }
  .entry-title a { color: inherit; text-decoration: none; border-bottom: 1px solid #d5d9f5; }
  .entry-title a:hover { color: var(--brand2); border-bottom-color: var(--brand2); }
  .entry-title a::after { content: ' \2197'; font-size: .75em; color: var(--brand2); }
  .entry-links { font-size: .78rem; margin-top: 3px; }
  .entry-links a { color: var(--link); text-decoration: none; margin-right: 6px; font-weight: 600; }
  .entry-links a:hover { opacity: .8; }
  .entry-sub { font-size: .88rem; color: var(--brand2); font-weight: 600; margin-top: 2px; }
  .entry-meta { font-size: .79rem; color: var(--muted); }
  .entry ul { margin: 9px 0 0 18px; }
  .entry li { font-size: .89rem; color: #374151; margin-bottom: 5px; }
  .entry-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .entry-tag {
    background: #f6f5ff; color: #6d28d9; border: 1px solid #ece9fd;
    border-radius: 999px; padding: 3px 10px; font-size: .74rem; font-weight: 600;
  }

  /* footer */
  .cv-footer {
    padding: 18px 34px 26px; border-top: 1px solid var(--line);
    border-radius: 0 0 18px 18px; background: white;
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 10px; font-size: .78rem; color: var(--muted);
  }
  .cv-footer a { color: var(--muted); text-decoration: none; }
  .cv-footer a:hover { color: var(--brand2); text-decoration: underline; }
  #adminLink { display: none; }

  .status-pill { display: inline-flex; align-items: center; gap: 6px; font-size: .72rem; color: var(--muted); }
  .dot-live { width: 7px; height: 7px; border-radius: 50%; background: #10b981; }
  .dot-static { width: 7px; height: 7px; border-radius: 50%; background: #d1d5db; }
  .loading { padding: 60px; text-align: center; color: var(--muted); }

  .topbar-spacer { height: 0; }

  /* ── Responsive ── */
  @media (max-width: 900px) {
    /* On a phone the download buttons take two rows, which is a lot of screen
       to spend on every scroll. Going down, they slide away and the section
       strip takes the top; coming back up, they return. */
    .toolbar {
      position: fixed; top: 0; left: 0; right: 0;
      transition: transform .28s cubic-bezier(.22,1,.36,1);
      will-change: transform;
    }
    .mobile-nav {
      position: fixed; top: var(--toolbar-h, 96px); left: 0; right: 0;
      transition: top .28s cubic-bezier(.22,1,.36,1);
    }
    .topbar-spacer { height: calc(var(--toolbar-h, 96px) + var(--nav-h, 44px)); }
    body.tools-hidden .toolbar { transform: translateY(-101%); }
    body.tools-hidden .mobile-nav { top: 0; }
    .cv-body { grid-template-columns: 1fr; }
    .cv-nav { display: none; }
    .mobile-nav { display: block; }
    .cv-main { padding: 20px 18px 32px; }
    .cv-header { padding: 30px 20px 26px; }
    .cv-name { font-size: 1.6rem; }
    .cv-footer { padding: 16px 18px 22px; }
    .page { padding: 0 10px; margin-top: 14px; }
    section.cv-section { scroll-margin-top: 150px; }
  }

  /* ════════════════════════════════════════════════════════════════
     PRINT / SAVE AS PDF
     Deliberately plain: serif body, navy rules, no gradients, no
     headline, no section icons. Signature Work and At a Glance are
     screen-only, so the printed CV stays close to a standard
     two-to-three page document.
     ════════════════════════════════════════════════════════════════ */
  @media print {
    @page { margin: 14mm 8mm; }
    html { font-size: 10.5pt; }
    body {
      background: #fff; color: #000; line-height: 1.35;
      font-family: Georgia, 'Times New Roman', Times, serif;
    }
    .toolbar, .mobile-nav, .cv-nav, .cv-footer, .no-print,
    .web-only { display: none !important; }

    .topbar-spacer { display: none !important; }
    .page { max-width: none; margin: 0; padding: 0; }
    /* The print dialog can be set to "Margins: None", which throws away the
       @page margin - so the inset is built into the sheet as well. */
    .sheet { box-shadow: none; border-radius: 0; padding: 0 9mm; }
    .cv-header, .cv-footer, .cv-nav { border-radius: 0; }
    /* Nothing should sit hard against the paper edge. */
    .cv-main, .cv-header { padding-left: 0; padding-right: 0; }
    img, table { max-width: 100%; }

    .cv-header {
      background: none !important; color: #000; padding: 0 0 5px;
      text-align: center; border-bottom: 1.6pt solid var(--print-navy); overflow: visible;
    }
    .cv-name {
      font-size: 15pt; font-weight: 700; letter-spacing: .5pt;
      text-transform: uppercase; color: var(--print-navy);
    }
    .cv-headline { display: none; }
    .cv-contacts { display: block; margin-top: 3pt; font-size: 8.6pt; }
    .chip {
      display: inline; background: none; border: none; padding: 0;
      color: #000; border-radius: 0;
    }
    .chip + .chip::before { content: ' | '; color: #444; }
    .chip-ic { display: none; }
    .cv-rights {
      margin-top: 3pt; font-size: 8.6pt; color: #000;
      border: none; padding: 0; text-align: center;
    }

    .cv-body { display: block; }
    .cv-main { padding: 0; }

    section.cv-section { padding: 6pt 0 0; border: none; break-inside: auto; }
    .sec-title {
      display: block; color: var(--print-navy); font-size: 10.5pt; font-weight: 700;
      text-transform: uppercase; letter-spacing: .4pt;
      border-bottom: 1.2pt solid var(--print-navy);
      padding-bottom: 1pt; margin: 9pt 0 5pt; break-after: avoid;
    }
    .sec-title .ic { display: none; }

    .para { font-size: 10pt; margin-bottom: 4pt; color: #000; }

    .pairs { display: block; }
    .pair { margin-bottom: 2pt; }
    .pair .lbl { display: inline; font-size: 10pt; text-transform: none; letter-spacing: 0; color: #000; }
    .pair .lbl::after { content: ': '; }
    .pair .val { color: #000; }

    /* Skills / certifications print as two-column bullet lists. */
    .group { margin-bottom: 5pt; }
    .group-name { color: #000; font-size: 10pt; font-weight: 700; font-style: italic; margin-bottom: 1pt; }
    .tags { display: block; columns: 2; column-gap: 16pt; }
    .tag, a.tag {
      display: list-item; list-style: disc; margin-left: 12pt;
      background: none; border: none; padding: 0; border-radius: 0;
      font-size: 9.6pt; color: #000; break-inside: avoid;
    }
    a.tag { color: #1155cc; text-decoration: none; }
    a.tag::after { content: ''; }

    /* Role on the left, dates on the right - the classic CV line. */
    /* A long role may flow onto the next page, but its heading block -
       role, dates, links and employer - never splits, and never sits at
       the foot of a page with nothing under it. */
    .entry { display: block; border-left: none; padding: 0 0 6pt 0; break-inside: auto; }
    .entry::before { display: none; }
    .entry-head {
      display: flex; justify-content: space-between; align-items: baseline;
      gap: 10pt; break-inside: avoid; break-after: avoid;
    }
    .entry-links, .entry-sub { break-after: avoid; break-inside: avoid; }
    .entry li, .para { break-inside: avoid; }
    .entry-title { font-size: 10.4pt; font-weight: 700; color: #000; }
    .entry-title a { color: #000; border: none; text-decoration: none; }
    .entry-title a::after { content: ''; }
    .entry-meta {
      text-align: right; margin: 0;
      font-size: 9.6pt; font-style: italic; font-weight: 700; color: #000; white-space: nowrap;
    }
    .entry-links { font-size: 8.8pt; margin: 0; }
    .entry-sub { font-style: italic; font-weight: 400; font-size: 9.8pt; color: #000; margin: 0; }
    .entry ul { margin: 2pt 0 0 14pt; }

    /* A section heading is never the last thing on a page, and the first
       entry under it comes with it. */
    .sec-title { break-after: avoid; break-inside: avoid; }
    .group-name { break-after: avoid; }
    section.cv-section > *:nth-child(2) { break-before: avoid; }
    .entry:first-of-type { break-before: avoid; }
    .entry li { font-size: 9.8pt; color: #000; margin-bottom: 1.5pt; }
    .entry-tags { display: none; }

    /* In print too: blue enough to read as a link, never underlined. */
    a, a.inline-link, .entry-links a, a.tag { color: #1155cc; text-decoration: none; }
  }
</style>
</head>

<div class="toolbar no-print">
  <a class="tb-btn" href="../index.html">

<script src="./cv-data.js"></script>

<script type="module">
  import { esc, loadCV, toMarkdown, downloadBlob, isConfigured, splitLink, mailtoLink }
    from './cv-common.js';

  let CV = null;

  /* ── Renderers per section type ── */
  function renderText(sec) {
    return (sec.paragraphs || []).map(p => `<p class="para">${richText(p)}</p>`).join('');
  }

  function renderPairs(sec) {
    return `<div class="pairs">${(sec.items || []).map(it => {
      const { text, url } = splitLink(it.value);
      const val = url
        ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(text)}</a>`
        : richText(it.value);
      return `<div class="pair">
        <span class="lbl">${esc(it.label)}</span>
        <span class="val">${val}</span>
      </div>`;
    }).join('')}</div>`;
  }

  /* Group items may carry their own link:  "Label | https://..." */
  function renderGroups(sec) {
    return (sec.groups || []).map(g => `
      <div class="group">
        <div class="group-name">${esc(g.name)}</div>
        <div class="tags">${(g.items || []).map(raw => {
          const { text, url } = splitLink(raw);
          return url
            ? `<a class="tag" href="${esc(url)}" target="_blank" rel="noopener">${esc(text)}</a>`
            : `<span class="tag">${esc(text)}</span>`;
        }).join('')}</div>
      </div>`).join('');
  }

  function renderEntries(sec) {
    return (sec.entries || []).map(e => `
      <div class="entry">
        <div class="entry-head">
          <div class="entry-title">${e.url
            ? `<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a>`
            : esc(e.title)}</div>
          ${e.meta ? `<div class="entry-meta">${richText(e.meta)}</div>` : ''}
        </div>
        ${(e.links || []).length
          ? `<div class="entry-links">${e.links.map(l =>
              `<a href="${esc(l.url)}" target="_blank" rel="noopener">[${esc(l.label)}]</a>`).join(' ')}</div>`
          : ''}
        ${e.subtitle ? `<div class="entry-sub">${esc(e.subtitle)}</div>` : ''}
        ${(e.bullets || []).length
          ? `<ul>${e.bullets.map(b => `<li>${richText(b)}</li>`).join('')}</ul>`
          : ''}
        ${(e.tags || []).length
          ? `<div class="entry-tags">${e.tags.map(t => `<span class="entry-tag">${esc(t)}</span>`).join('')}</div>`
          : ''}
      </div>`).join('');
  }

  /** Render a value that may contain markdown-style links, e.g.
   *  "Contact details on [request](mailto:...)". Everything outside a link
   *  still gets bare domains and email addresses linked automatically. */
  const MD_LINK = /\[([^\]]+)\]\(((?:https?:\/\/|mailto:)[^)\s]+)\)/g;
  function richText(value) {
    const src = String(value == null ? '' : value);
    let out = '', last = 0, m;
    MD_LINK.lastIndex = 0;
    while ((m = MD_LINK.exec(src)) !== null) {
      out += linkify(src.slice(last, m.index));
      const external = m[2].startsWith('mailto:') ? '' : ' target="_blank" rel="noopener"';
      out += `<a class="inline-link" href="${esc(m[2])}"${external}>${esc(m[1])}</a>`;
      last = m.index + m[0].length;
    }
    return out + linkify(src.slice(last));
  }

  /** Turn bare domains and email addresses inside already-escaped text into
   *  links. Emails are matched first so the domain half is never linked twice. */
  const LINK_RE = /([\w.+-]+@[\w-]+\.[\w.]+)|([a-z0-9-]+(?:\.[a-z0-9-]+)*\.(?:github\.io|com|org|net|au|lk|edu|uk|cn)(?:\/[^\s,;)]*)?)/gi;
  function linkify(value) {
    return esc(value).replace(LINK_RE, (match, mail) => mail
      ? `<a class="inline-link" href="mailto:${mail}">${mail}</a>`
      : `<a class="inline-link" href="https://${match}" target="_blank" rel="noopener">${match}</a>`);
  }

  /* A donut of where the work actually goes. Five slices, each with its own
     legend row and percentage, so identity never rests on colour alone. The
     palette was checked with the dataviz validator (all-pairs, light surface). */
  const SLICE_COLOURS = ['#2a78d6', '#e34948', '#1baf7a', '#4a3aa7', '#eda100'];

  function renderChart(sec) {
    const slices = (sec.slices || []).filter(sl => Number(sl.value) > 0);
    if (!slices.length) return '';
    const total = slices.reduce((a, sl) => a + Number(sl.value), 0) || 1;
    const R = 70, C = 2 * Math.PI * R, GAP = 3;
    let offset = 0;

    const arcs = slices.map((sl, i) => {
      const frac = Number(sl.value) / total;
      const len = Math.max(frac * C - GAP, 1);
      const arc = `<circle class="slice" data-i="${i}" cx="100" cy="100" r="${R}"
        stroke="${SLICE_COLOURS[i % SLICE_COLOURS.length]}"
        stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}"
        stroke-dashoffset="${(-offset).toFixed(2)}"><title>${esc(sl.label)}: ${Math.round(frac * 100)}%</title></circle>`;
      offset += frac * C;
      return arc;
    }).join('');

    const legend = slices.map((sl, i) => `
      <div class="legend-row" data-i="${i}">
        <span class="legend-swatch" style="background:${SLICE_COLOURS[i % SLICE_COLOURS.length]}"></span>
        <span>${esc(sl.label)}</span>
        <span class="legend-pct">${Math.round(Number(sl.value) / total * 100)}%</span>
      </div>`).join('');

    const target = sec.link || '#sec-projects';
    return `<button type="button" class="chart-wrap" data-chart-link="${esc(target)}">
        <svg class="donut" viewBox="0 0 200 200" role="img"
             aria-label="Profile mix: ${slices.map(sl => `${esc(sl.label)} ${Math.round(Number(sl.value) / total * 100)} per cent`).join(', ')}">
          <g transform="rotate(-90 100 100)">${arcs}</g>
          <text class="donut-centre-label" x="100" y="94" text-anchor="middle">PROFILE</text>
          <text class="donut-centre-value" x="100" y="116" text-anchor="middle">Mix</text>
        </svg>
        <div class="chart-legend">${legend}</div>
      </button>
      ${sec.caption ? `<p class="chart-caption">${richText(sec.caption)}</p>` : ''}`;
  }

  const RENDERERS = { text: renderText, pairs: renderPairs, groups: renderGroups,
                      entries: renderEntries, chart: renderChart };

  function render(cv) {
    const m = cv.meta || {};
    document.title = `Curriculum Vitae - ${m.name || 'CV'}`;
    document.getElementById('cvName').textContent = m.name || '';
    document.getElementById('cvHeadline').textContent = m.headline || '';

    const chips = [];
    if (m.location) chips.push({ t: m.location, h: '', i: '📍' });
    if (m.phone)    chips.push({ t: m.phone, h: `tel:${m.phone.replace(/\s/g, '')}`, i: '📞' });
    if (m.email)    chips.push({ t: m.email, h: mailtoLink(m), i: '✉️' });
    if (m.linkedin) chips.push({ t: 'LinkedIn', h: m.linkedin, i: '🔗' });
    if (m.portfolio) chips.push({ t: 'Portfolio', h: m.portfolio, i: '🌐' });
    if (m.seek) chips.push({ t: 'SEEK', h: m.seek, i: '💼' });
    if (m.rightToWork) chips.push({ t: 'Right to Work', h: m.rightToWork, i: '🛂' });
    document.getElementById('cvContacts').innerHTML = chips.map(c =>
      c.h
        ? `<a class="chip" href="${esc(c.h)}"${c.h.startsWith('mailto:') ? '' : ' target="_blank" rel="noopener"'}><span class="chip-ic">${c.i}</span>${esc(c.t)}</a>`
        : `<span class="chip"><span class="chip-ic">${c.i}</span>${esc(c.t)}</span>`
    ).join('');

    const rights = document.getElementById('cvRights');
    if (m.workRights) { rights.style.display = ''; rights.textContent = m.workRights; }

    const sections = cv.sections || [];
    document.getElementById('cvSections').innerHTML = sections.map(sec => {
      const fn = RENDERERS[sec.type] || (() => '');
      return `<section class="cv-section${sec.webOnly ? ' web-only' : ''}" id="sec-${esc(sec.id)}">
        <h2 class="sec-title"><span class="ic">${esc(sec.icon || '•')}</span>${esc(sec.title)}</h2>
        ${fn(sec)}
      </section>`;
    }).join('');

    const navHtml = sections.map(sec =>
      `<a href="#sec-${esc(sec.id)}" data-sec="sec-${esc(sec.id)}">${esc(sec.title)}</a>`
    ).join('');
    document.getElementById('cvNav').innerHTML = navHtml;
    document.getElementById('mobileNav').innerHTML = navHtml;

    document.getElementById('cvUpdated').textContent = m.updated ? `Last updated: ${m.updated}` : '';
    wireChart();
    observeSections();
  }

  /* The chart reads as one control: hovering a legend row lights its slice,
     the centre names what is under the pointer, and a click jumps to the
     section the slices are evidence for. */
  function wireChart() {
    document.querySelectorAll('.chart-wrap').forEach(wrap => {
      const label = wrap.querySelector('.donut-centre-label');
      const value = wrap.querySelector('.donut-centre-value');
      const rows  = [...wrap.querySelectorAll('.legend-row')];
      const arcs  = [...wrap.querySelectorAll('.slice')];

      const show = i => {
        arcs.forEach(a => a.classList.toggle('is-on', Number(a.dataset.i) === i));
        if (i === null) { label.textContent = 'PROFILE'; value.textContent = 'Mix'; return; }
        label.textContent = 'SHARE';
        value.textContent = rows[i].querySelector('.legend-pct').textContent;
      };

      rows.forEach((row, i) => {
        row.addEventListener('mouseenter', () => show(i));
        row.addEventListener('mouseleave', () => show(null));
      });
      arcs.forEach((arc, i) => {
        arc.addEventListener('mouseenter', () => show(i));
        arc.addEventListener('mouseleave', () => show(null));
      });
      wrap.addEventListener('mouseleave', () => show(null));

      wrap.addEventListener('click', () => {
        const target = document.querySelector(wrap.dataset.chartLink);
        if (target) target.scrollIntoView({ behavior: 'smooth' });
      });
    });
  }

  /* Keep the section list in step with what is on screen, and keep the
     active chip inside the mobile strip visible. */
  let observer = null;
  function observeSections() {
    if (observer) observer.disconnect();
    const links = [...document.querySelectorAll('#cvNav a, #mobileNav a')];
    if (!links.length) return;
    const strip = document.getElementById('mobileNav');
    observer = new IntersectionObserver(entries => {
      entries.forEach(en => {
        if (!en.isIntersecting) return;
        links.forEach(a => a.classList.toggle('active', a.dataset.sec === en.target.id));
        const chip = strip.querySelector(`a[data-sec="${en.target.id}"]`);
        if (chip && strip.offsetParent !== null) {
          const target = chip.offsetLeft - strip.clientWidth / 2 + chip.clientWidth / 2;
          strip.scrollTo({ left: Math.max(0, target), behavior: 'smooth' });
        }
      });
    }, { rootMargin: '-120px 0px -70% 0px', threshold: 0 });
    document.querySelectorAll('section.cv-section').forEach(s => observer.observe(s));
  }

  function setStatus(source) {
    const el = document.getElementById('cvStatus');
    el.innerHTML = source === 'firebase'
      ? '<span class="dot-live"></span> Live content'
      : `<span class="dot-static"></span> ${isConfigured() ? 'Cached content' : 'Static content'}`;
  }

  /* ── Toolbar actions ── */
  document.getElementById('btnPdf').addEventListener('click', () => window.print());
  document.getElementById('btnMd').addEventListener('click', () => {
    if (!CV) return;
    const name = ((CV.meta && CV.meta.name) || 'CV').replace(/\s+/g, '_');
    downloadBlob(toMarkdown(CV), `${name}_CV.md`, 'text/markdown;charset=utf-8');
  });
  document.getElementById('btnMail').addEventListener('click', () => {
    window.location.href = mailtoLink(CV && CV.meta);
  });

  /* Measure the two bars so the spacer and the slide distance stay honest
     when the toolbar wraps to a different number of rows. */
  function measureBars() {
    const toolbar = document.querySelector('.toolbar');
    const nav = document.getElementById('mobileNav');
    const root = document.documentElement;
    root.style.setProperty('--toolbar-h', `${Math.round(toolbar.offsetHeight)}px`);
    root.style.setProperty('--nav-h', `${Math.round(nav.offsetHeight)}px`);
  }

  /* Scrolling down hides the download bar and leaves the section strip;
     scrolling up brings it back. Only the phone layout uses it - on desktop
     the class is simply never set. */
  function watchScroll() {
    let lastY = window.scrollY;
    let ticking = false;
    const apply = () => {
      const y = window.scrollY;
      const isPhone = window.matchMedia('(max-width: 900px)').matches;
      if (!isPhone || y < 80) {
        document.body.classList.remove('tools-hidden');
      } else if (y > lastY + 6) {
        document.body.classList.add('tools-hidden');
      } else if (y < lastY - 6) {
        document.body.classList.remove('tools-hidden');
      }
      lastY = y;
      ticking = false;
    };
    window.addEventListener('scroll', () => {
      if (!ticking) { ticking = true; requestAnimationFrame(apply); }
    }, { passive: true });
    window.addEventListener('resize', () => {
      measureBars();
      if (!window.matchMedia('(max-width: 900px)').matches) {
        document.body.classList.remove('tools-hidden');
      }
    });
  }

  /* The admin link only appears on  /cv/#admin  (or /cv/?admin). */
  function maybeShowAdmin() {
    const wanted = location.hash.toLowerCase() === '#admin'
                || /(^|[?&])admin($|[=&])/i.test(location.search);
    document.getElementById('adminLink').style.display = wanted ? 'inline' : 'none';
  }
  window.addEventListener('hashchange', maybeShowAdmin);

  /* ── Boot ── */
  (async () => {
    const { data, source } = await loadCV();
    CV = data;
    render(CV);
    setStatus(source);
    maybeShowAdmin();
    measureBars();
    watchScroll();
    /* Honour a #sec-... deep link once the sections exist. */
    if (location.hash.startsWith('#sec-')) {
      const target = document.querySelector(location.hash);
      if (target) target.scrollIntoView();
    }
  })();
</script>
</body>
</html>
